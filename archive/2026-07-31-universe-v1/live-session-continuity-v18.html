<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#09100e" /><title>Membar — source continuity guard</title><style>body{margin:0;background:#09100e;color:#e1eee3;font:14px/1.5 system-ui,sans-serif}main{width:min(720px,calc(100% - 32px));margin:0 auto;padding:28px 0 60px}a{color:#c4ea9c}.kicker{color:#91d0bc;font-size:10px;letter-spacing:.14em;text-transform:uppercase}h1{font:46px Georgia,serif;font-weight:400;line-height:.95}.panel{border:1px solid #2b4035;border-radius:10px;padding:22px;background:#101916}.context{display:grid;grid-template-columns:1fr 1fr;gap:14px}.context div{border-top:1px solid #2b4035;padding-top:10px}.context small{display:block;color:#6f8477;font-size:10px}.context strong{display:block;margin-top:3px;font-weight:500}.button{display:inline-block;margin-top:22px;padding:11px 13px;border:1px solid #496b55;border-radius:6px;text-decoration:none}@media(max-width:560px){h1{font-size:40px}.context{grid-template-columns:1fr}}</style></head><body><main><a id="back" href="../../index.html#timeline">← timeline</a><p class="kicker" style="margin-top:42px">ARCHIVE V1 / CONTINUITY GUARD · V18</p><h1>Source identity stays attached.</h1><p>This versioned route rejects stored rehearsal passes from a different source moment before offering the new Workbench reading.</p><section class="panel"><div class="context"><div><small>song / artist</small><strong id="song"></strong></div><div><small>source</small><strong id="source"></strong></div><div><small>section / time</small><strong id="section"></strong></div><div><small>chord / lyric</small><strong id="chord"></strong></div></div><a class="button" id="reading" href="../../rehearsal-reading-v18.html">Open rehearsal reading ↗</a></section></main><script src="../../timeline-handoff-v17.js"></script><script src="live-session-continuity-state-v18.js"></script><script>const H=window.MembarTimelineHandoff;const p=H.decode(new URLSearchParams(location.search).get('moment'))||H.contextFor({id:'live-rehearsal'});const $=id=>document.getElementById(id);$('song').textContent=p.song+' · '+p.artist;$('source').textContent=p.source;$('section').textContent=p.section+' · '+p.time;$('chord').textContent=p.chord+' · '+p.lyric;document.getElementById('reading').href='../../rehearsal-reading-v18.html?moment='+H.encode(p);document.getElementById('back').href='../../index.html?returnMoment='+encodeURIComponent(p.id)+'#timeline';</script></body></html>
